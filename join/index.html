<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="申请加入 WIGSWAN 全球增长网络，开启门店数字化评估。">
  <title>合伙人审计 | 开启盈利诊断 - WIGSWAN</title>
  <link rel="stylesheet" href="../index.css?v=2.1">
  <style>
    .audit-form-container {
      margin-top: 60px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .input-field {
      margin-bottom: 30px;
    }
    .input-field label {
      display: block;
      margin-bottom: 12px;
      font-weight: 600;
      color: var(--accent-gold);
    }
    .input-field input, .input-field select, .input-field textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 15px 20px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .input-field input:focus {
      border-color: var(--accent-gold);
    }
    .step-indicator {
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
      justify-content: center;
    }
    .indicator-dot {
      width: 40px;
      height: 4px;
      background: var(--glass-border);
      border-radius: 2px;
    }
    .indicator-dot.active {
      background: var(--accent-gold);
    }
  </style>
</head>
<body class="sub-page">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">S</span>
        <strong>WIGSWAN<br><small>PARTNER AUDIT</small></strong>
      </a>
      <nav class="main-nav">
        <a href="../index.html">首页</a>
        <a href="../meiye-yunlian.html">增长中枢</a>
        <a href="../success-cases.html">全球案例</a>
        <a href="#" class="active">申请诊断</a>
      </nav>
    </div>
  </header>

  <main style="padding: 140px 0 80px;">
    <div class="shell">
      <div class="section-header">
        <p class="hero-eyebrow">Onboarding Process</p>
        <h2>战略合伙人资格审计</h2>
        <p>WIGSWAN 仅筛选具有强烈增长意愿且具备高标准交付能力的门店，开启 60 天盈利闭环实验。</p>
      </div>

      <div class="audit-form-container glass-card">
        <div class="step-indicator">
          <div class="indicator-dot active"></div>
          <div class="indicator-dot"></div>
          <div class="indicator-dot"></div>
        </div>

        <form id="auditForm">
          <!-- Step 1: Base Profile -->
          <div class="form-step active" data-step="1">
            <h3 style="margin-bottom: 24px; color: #fff;">01. 门店经营画像</h3>
            <div class="input-field">
              <label>机构全称 / 品牌</label>
              <input type="text" placeholder="例如：型格沙龙深圳旗舰店" required>
            </div>
            <div class="input-field">
              <label>目前核心业务占比</label>
              <select>
                <option>传统洗剪吹为主</option>
                <option>烫染护理为主</option>
                <option>已有假发/接发项目</option>
              </select>
            </div>
            <div class="input-field">
              <label>主要客流获取渠道</label>
              <select>
                <option>自然到店 / 地推</option>
                <option>美团 / 点评团购</option>
                <option>抖音 / 视频号公域</option>
                <option>私域流量 / 老客转介绍</option>
              </select>
            </div>
            <button type="button" class="btn primary next-btn" style="width: 100%;">下一步：交付能力评估</button>
          </div>

          <!-- Step 2: Capacity -->
          <div class="form-step" data-step="2">
            <h3 style="margin-bottom: 24px; color: #fff;">02. 交付与内容基础</h3>
            <div class="input-field">
              <label>资深发型师数量 (5年以上经验)</label>
              <input type="number" value="2">
            </div>
            <div class="input-field">
              <label>是否有专人负责短视频/社交媒体运营？</label>
              <select>
                <option>有专职运营团队</option>
                <option>店长/发型师兼职</option>
                <option>外包代运营</option>
                <option>暂无人员投入</option>
              </select>
            </div>
            <div class="input-field">
              <label>是否具备独立私密接待空间？</label>
              <select>
                <option>已具备独立房间</option>
                <option>可进行半私密改造</option>
                <option>暂无（需专家指导规划）</option>
              </select>
            </div>
            <div style="display: flex; gap: 20px;">
              <button type="button" class="btn ghost prev-btn" style="flex: 1; margin: 0;">返回</button>
              <button type="button" class="btn primary next-btn" style="flex: 2;">下一步：联系方式</button>
            </div>
          </div>

          <!-- Step 3: Contact -->
          <div class="form-step" data-step="3">
            <h3 style="margin-bottom: 24px; color: #fff;">03. 增长顾问对接</h3>
            <div class="input-field">
              <label>主理人姓名</label>
              <input type="text" required>
            </div>
            <div class="input-field">
              <label>联系电话（接收诊断报告）</label>
              <input type="tel" required>
            </div>
            <div style="display: flex; gap: 20px;">
              <button type="button" class="btn ghost prev-btn" style="flex: 1; margin: 0;">返回</button>
              <button type="submit" class="btn primary" style="flex: 2;">提交审计并获取 1V1 报告</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const steps = document.querySelectorAll('.form-step');
      const dots = document.querySelectorAll('.indicator-dot');
      const nextBtns = document.querySelectorAll('.next-btn');
      const prevBtns = document.querySelectorAll('.prev-btn');
      let currentStep = 0;

      nextBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          steps[currentStep].classList.remove('active');
          dots[currentStep].classList.remove('active');
          currentStep++;
          steps[currentStep].classList.add('active');
          dots[currentStep].classList.add('active');
        });
      });

      prevBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          steps[currentStep].classList.remove('active');
          dots[currentStep].classList.remove('active');
          currentStep--;
          steps[currentStep].classList.add('active');
          dots[currentStep].classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
